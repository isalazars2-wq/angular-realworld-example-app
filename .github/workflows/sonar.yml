
name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonar:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '12.22.12'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build

      - name: Configure Chrome for tests
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$CHROME_PATH" > "$RUNNER_TEMP/chrome-no-sandbox"
          chmod +x "$RUNNER_TEMP/chrome-no-sandbox"
          echo "CHROME_BIN=$RUNNER_TEMP/chrome-no-sandbox" >> "$GITHUB_ENV"

      
      - name: Run unit tests with coverage
        run: |
          if find src -type f -name '*.spec.ts' -print -quit | grep -q .; then
            echo "Unit tests found. Running tests..."
            npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
          else
            echo "No unit tests found in src. Skipping test execution."
          fi

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=isalazars2-wq
            -Dsonar.projectKey=isalazars2-wq_angular-realworld-example-app
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
